<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>PIN Tracker · 0 3 6 9</title>
<style>
:root{--bg:#060b14;--panel:#0d1624;--panel2:#111d2e;--line:#22324a;--text:#eef5ff;--muted:#91a1b7;--accent:#65d5c8;--accent2:#7ca7ff;--danger:#ff8c9d;--shadow:0 24px 70px #0008}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 5%,#173354 0,#060b14 35%,#04070d 100%);color:var(--text);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer;color:inherit;border:0}.hidden{display:none!important}.auth{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:#03060ccc;backdrop-filter:blur(16px)}.auth-box{width:min(390px,100%);padding:30px;border:1px solid #ffffff18;border-radius:28px;background:linear-gradient(145deg,#17263a,#0b1421);box-shadow:var(--shadow);text-align:center}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:18px}.auth .brand{justify-content:center;margin-bottom:20px}.brand-mark{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,var(--accent),#4c8eff);color:#06101b;font-weight:900}.auth h1{margin:0 0 8px;font-size:25px}.auth p{color:var(--muted);margin:0 0 22px}.field{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#07101d;color:var(--text);outline:none}.field:focus{border-color:var(--accent)}.primary{width:100%;padding:13px 16px;border-radius:14px;background:linear-gradient(135deg,var(--accent),#78a9ff);color:#06101b;font-weight:800;margin-top:12px}.error{color:var(--danger);min-height:22px;margin-top:10px;font-size:13px}.app{width:min(1500px,100%);margin:auto;padding:22px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.sub{color:var(--muted);font-size:13px;margin-top:2px}.layout{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(330px,.95fr);gap:22px;align-items:start}.left,.phone-wrap{min-width:0}.panel{background:linear-gradient(145deg,#101b2bdb,#0b1320e8);border:1px solid #ffffff12;border-radius:24px;box-shadow:0 18px 50px #0004}.stats{padding:18px 20px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:12px 14px;border:1px solid #ffffff0d;border-radius:16px;background:#ffffff05}.stat b{display:block;font-size:24px}.stat span{color:var(--muted);font-size:12px}.progress{grid-column:1/-1;height:8px;overflow:hidden;border-radius:99px;background:#26344a}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:inherit;transition:width .25s}.toolbar{margin:14px 0;display:flex;gap:8px;flex-wrap:wrap}.filter{padding:9px 13px;border-radius:12px;background:#111e30;color:var(--muted);border:1px solid #ffffff0d}.filter.active,.filter:hover{background:#1b334d;color:var(--text);border-color:#65d5c866}.search{flex:1;min-width:190px;padding:9px 13px;border-radius:12px;border:1px solid #ffffff12;background:#0c1726;color:var(--text);outline:none}.category{margin:14px 0;overflow:hidden}.category-head{padding:15px 18px;display:flex;align-items:center;justify-content:space-between;background:#ffffff05;border-bottom:1px solid #ffffff0d}.category-title{font-weight:800}.category-count{font-size:12px;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px;padding:14px}.pin-card{position:relative;padding:13px 8px;border:1px solid #ffffff12;border-radius:15px;background:#122137;transition:.18s;text-align:center}.pin-card:hover{transform:translateY(-2px);border-color:#65d5c877}.pin-card.checked{background:#080e18;color:#63738b;border-color:#1b293c}.pin-card.checked .pin-code{text-decoration:line-through;text-decoration-thickness:2px}.pin-code{font-size:21px;letter-spacing:3px;font-weight:800}.pin-tag{display:block;font-size:10px;color:var(--muted);margin-top:3px}.checked-mark{position:absolute;right:8px;top:5px;color:var(--accent);font-size:12px}.empty{padding:22px;color:var(--muted);text-align:center}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.small-btn{padding:10px 13px;border-radius:12px;background:#122137;color:var(--text);border:1px solid #ffffff12}.small-btn:hover{border-color:#65d5c877}.danger{color:#ffb1bd}.phone-wrap{position:sticky;top:18px}.phone{max-width:420px;margin:auto;padding:12px;border-radius:42px;background:linear-gradient(145deg,#38495b,#0d1622 23%,#02060c);box-shadow:0 25px 80px #000b;border:1px solid #ffffff2a}.phone-screen{position:relative;overflow:hidden;min-height:720px;border-radius:32px;background:radial-gradient(circle at 50% 20%,#284b6c 0,#0e2438 28%,#07111d 62%,#02060d 100%);padding:25px 24px 24px;display:flex;flex-direction:column}.phone-screen:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#ffffff08,transparent 35%);pointer-events:none}.status{display:flex;justify-content:space-between;color:#ffffffbb;font-size:11px;position:relative}.lock-clock{text-align:center;margin-top:40px;position:relative}.lock-clock .time{font-size:62px;line-height:1;font-weight:300;letter-spacing:-3px}.lock-clock .date{margin-top:10px;color:#d9e8f6bb}.pin-dots{display:flex;justify-content:center;gap:13px;margin:42px 0 22px;position:relative}.dot{width:13px;height:13px;border-radius:50%;border:1px solid #ffffffbb}.dot.filled{background:var(--accent);box-shadow:0 0 16px var(--accent)}.typed{text-align:center;min-height:26px;color:#d6e5f2;font-size:14px;letter-spacing:4px;position:relative}.trajectory{position:absolute;inset:0;pointer-events:none;z-index:1}.keys{position:relative;z-index:2;margin-top:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:15px 16px;padding:15px 7px 5px}.key{height:65px;border-radius:50%;background:#ffffff0b;border:1px solid #ffffff18;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:25px;font-weight:300;transition:.12s;backdrop-filter:blur(4px)}.key small{font-size:9px;color:#ffffff66;letter-spacing:1px}.key:hover,.key:active{background:#ffffff20;transform:scale(.96)}.key.allowed{color:var(--accent);border-color:#65d5c855;box-shadow:inset 0 0 20px #65d5c80c}.key.muted{color:#abb8c7}.key.action{font-size:15px;color:#d5e0ee}.result{position:relative;z-index:2;margin-top:16px;text-align:center;min-height:70px}.result button{margin-top:8px}.hint{font-size:12px;color:#9eb0c4}.footer-note{margin-top:12px;text-align:center;color:#718197;font-size:11px}@media(max-width:900px){.layout{grid-template-columns:1fr}.phone-wrap{position:static;grid-row:1}.left{grid-row:2}.phone{max-width:430px}.phone-screen{min-height:670px}}@media(max-width:520px){.app{padding:12px}.topbar{align-items:flex-start}.stats{padding:12px;gap:7px}.stat{padding:9px}.stat b{font-size:20px}.cards{grid-template-columns:repeat(3,1fr);padding:10px;gap:7px}.pin-card{padding:11px 4px}.pin-code{font-size:17px}.phone{border-radius:32px;padding:8px}.phone-screen{border-radius:25px;padding:20px 16px;min-height:640px}.lock-clock .time{font-size:52px}.keys{gap:11px 10px}.key{height:58px}}
</style>
</head>
<body>
<section class="auth" id="auth"><div class="auth-box"><div class="brand"><span class="brand-mark">P</span><span>PIN Tracker</span></div><h1>Закрытая страница</h1><p>Введите пароль, чтобы открыть список комбинаций.</p><input class="field" id="password" type="password" inputmode="numeric" placeholder="Пароль" autocomplete="off"><button class="primary" id="login">Войти</button><div class="error" id="authError"></div></div></section>
<main class="app hidden" id="app">
<header class="topbar"><div><div class="brand"><span class="brand-mark">P</span><span>PIN Tracker</span></div><div class="sub">Систематический подбор PIN-кода из 0 · 3 · 6 · 9</div></div><button class="small-btn" id="logout">Выйти</button></header>
<div class="layout"><section class="left"><div class="panel stats"><div class="stat"><b id="total">256</b><span>Всего комбинаций</span></div><div class="stat"><b id="checked">0</b><span>Проверено</span></div><div class="stat"><b id="remaining">256</b><span>Осталось</span></div><div class="progress"><i id="progress"></i></div></div>
<div class="toolbar"><button class="filter active" data-filter="all">Все</button><button class="filter" data-filter="unchecked">Только непроверенные</button><button class="filter" data-filter="checked">Только вычеркнутые</button><input class="search" id="search" placeholder="Быстрый поиск по цифрам…" inputmode="numeric"></div><div id="categories"></div><div class="actions"><button class="small-btn" id="export">Экспорт прогресса (JSON)</button><button class="small-btn danger" id="reset">Сбросить всё</button></div></section>
<aside class="phone-wrap"><div class="phone"><div class="phone-screen"><div class="status"><span id="statusTime">12:00</span><span>▮▮▮　⌁　▰</span></div><div class="lock-clock"><div class="time" id="clock">12:00</div><div class="date" id="date">Четверг, 1 января</div></div><div class="pin-dots" id="dots"><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div><div class="typed" id="typed">Введите PIN</div><svg class="trajectory" id="trajectory" viewBox="0 0 100 100" preserveAspectRatio="none"><polyline id="path" fill="none" stroke="#65d5c8" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/></svg><div class="keys" id="keys"></div><div class="result" id="result"></div><div class="footer-note">Samsung One UI · учебный симулятор</div></div></div></aside></div>
</main>
<script>
(() => {
  const DIGITS=['0','3','6','9'], STORAGE='pin-tracker-v1', AUTH='pin-tracker-auth';
  const categoryOrder=['same','palindrome','pair','blocks','different','triple','other'];
  const categoryNames={same:'Одинаковые',palindrome:'Зеркальные / Палиндромы',pair:'Парные / Повторяющиеся',blocks:'Двойные блоки',different:'Все 4 цифры разные',triple:'Тройной повтор',other:'Остальные комбинации'};
  const categoryInfo={same:'AAAA',palindrome:'ABBA',pair:'ABAB',blocks:'AABB',different:'ABCD',triple:'AAAB / AABA / ABAA / BAAA',other:'ровно 3 разные цифры'};
  const all=[];
  const classify = s => { const a=[...s], counts=Object.values(a.reduce((m,x)=>(m[x]=(m[x]||0)+1,m),{})).sort((x,y)=>y-x); if(counts[0]===4)return'same'; if(a[0]===a[3]&&a[1]===a[2])return'palindrome'; if(a[0]===a[2]&&a[1]===a[3])return'pair'; if(a[0]===a[1]&&a[2]===a[3])return'blocks'; if(counts.join(',')==='1,1,1,1')return'different'; if(counts.join(',')==='3,1')return'triple'; return'other'; };
  for(let n=0;n<256;n++){let x=n.toString(4).padStart(4,'0'), code=[...x].map(i=>DIGITS[+i]).join('');all.push({code,category:classify(code)});}
  let checked=new Set(JSON.parse(localStorage.getItem(STORAGE)||'[]')); let filter='all', query='', entered='', points=[];
  const $=id=>document.getElementById(id); const save=()=>localStorage.setItem(STORAGE,JSON.stringify([...checked]));
  const render=()=>{ $('checked').textContent=checked.size; $('remaining').textContent=all.length-checked.size; $('progress').style.width=(checked.size/all.length*100)+'%'; const root=$('categories');root.innerHTML=''; categoryOrder.forEach(cat=>{let list=all.filter(x=>x.category===cat&&(!query||x.code.includes(query))&&(filter==='all'||filter==='checked'&&checked.has(x.code)||filter==='unchecked'&&!checked.has(x.code))); if(!list.length)return; let box=document.createElement('section');box.className='panel category';box.innerHTML=`<div class="category-head"><span class="category-title">${categoryNames[cat]} <span class="category-count">(${all.filter(x=>x.category===cat).length})</span></span><span class="category-count">${categoryInfo[cat]}</span></div><div class="cards"></div>`;let cards=box.querySelector('.cards');list.forEach(item=>{let b=document.createElement('button');b.className='pin-card '+(checked.has(item.code)?'checked':'');b.innerHTML=`<span class="pin-code">${item.code}</span><span class="pin-tag">${checked.has(item.code)?'проверен':'на проверку'}</span>${checked.has(item.code)?'<span class="checked-mark">✓</span>':''}`;b.onclick=()=>{checked.has(item.code)?checked.delete(item.code):checked.add(item.code);save();render();};cards.appendChild(b)});root.appendChild(box)});if(!root.children.length)root.innerHTML='<div class="panel empty">Ничего не найдено по текущему фильтру.</div>';};
  document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()}); $('search').oninput=e=>{query=e.target.value.replace(/[^0369]/g,'').slice(0,4);e.target.value=query;render()};
  $('export').onclick=()=>{let data={exportedAt:new Date().toISOString(),total:all.length,checked:[...checked],unchecked:all.filter(x=>!checked.has(x.code)).map(x=>x.code)};let url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download='pin-progress.json';a.click();URL.revokeObjectURL(url)};
  $('reset').onclick=()=>{if(confirm('Сбросить все отметки? Это действие нельзя отменить.')){checked.clear();save();render()}};
  const keyLayout=[['1','muted'],['2','muted'],['3','allowed'],['4','muted'],['5','muted'],['6','allowed'],['7','muted'],['8','muted'],['9','allowed'],['','action'],['0','allowed'],['⌫','action']]; let keys=$('keys'); keyLayout.forEach(([v,kind],i)=>{let b=document.createElement('button');b.className='key '+kind;b.dataset.key=v;b.innerHTML=v?`${v}${['2','3','4','5','6','8'].includes(v)?`<small>${v==='2'?'ABC':v==='3'?'DEF':v==='4'?'GHI':v==='5'?'JKL':v==='6'?'MNO':'TUV'}</small>`:''}`:'<span> </span>';b.onclick=()=>press(v);keys.appendChild(b)});
  function press(v){if(v==='⌫'){entered=entered.slice(0,-1);points.pop()}else if(v&&entered.length<4){entered+=v;let btn=[...keys.children].find(x=>x.dataset.key===v);if(btn){let r=btn.getBoundingClientRect(), k=keys.getBoundingClientRect();points.push({x:(r.left+r.width/2-k.left)/k.width*100,y:(r.top+r.height/2-k.top)/k.height*100});}}updateSim();}
  function updateSim(){[...$('dots').children].forEach((d,i)=>d.classList.toggle('filled',i<entered.length));$('typed').textContent=entered||'Введите PIN';$('path').setAttribute('points',points.map(p=>`${p.x},${p.y}`).join(' '));let out=$('result');if(entered.length===4){let exists=all.some(x=>x.code===entered), isChecked=checked.has(entered);out.innerHTML=exists?`<div class="hint">Код ${isChecked?'уже вычеркнут':'найден в списке'}</div><button class="small-btn ${isChecked?'':'danger'}" id="markCode">${isChecked?'Вернуть код в список':'Вычеркнуть этот код из списка'}</button>`:'<div class="hint">Такой код не входит в набор 0 · 3 · 6 · 9</div>';if(exists)$('markCode').onclick=()=>{isChecked?checked.delete(entered):checked.add(entered);save();render();updateSim()}}else out.innerHTML='';}
  document.addEventListener('keydown',e=>{if($('auth').classList.contains('hidden')){if(/^\d$/.test(e.key))press(e.key);if(e.key==='Backspace')press('⌫')}});
  function clock(){let d=new Date();$('clock').textContent=d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});$('statusTime').textContent=$('clock').textContent;$('date').textContent=d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});} setInterval(clock,1000);clock();
  function open(){ $('auth').classList.add('hidden');$('app').classList.remove('hidden');render();} $('login').onclick=()=>{if($('password').value==='2003'){sessionStorage.setItem(AUTH,'1');$('authError').textContent='';open()}else $('authError').textContent='Неверный пароль'};$('password').onkeydown=e=>{if(e.key==='Enter')$('login').click()};$('logout').onclick=()=>{sessionStorage.removeItem(AUTH);location.reload()};if(sessionStorage.getItem(AUTH)==='1')open();
})();
</script>
</body>
</html>
